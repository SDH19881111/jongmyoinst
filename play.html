<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>종묘제례악 악기 연주</title>
<style>
  :root { --bg: #1d1a17; --fg: #f3ede4; --muted: #b8ad9e; --accent: #b8432f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100dvh; padding: 12px 16px; gap: 10px; overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; width: min(100%, 1200px, (100dvh - 90px) * 4 / 3); }
  h1 { font-size: 1.15rem; margin: 0; font-weight: 700; letter-spacing: -0.02em; flex: 1; }
  a.icon { text-decoration: none; }
  .icon { background: transparent; border: 1px solid #4a433b; color: var(--fg); border-radius: 8px;
    padding: 6px 10px; font: inherit; font-size: 0.85rem; cursor: pointer; }
  .icon:hover { background: #2c2722; }
  #stage { display: block; width: min(100%, 1200px, (100dvh - 90px) * 4 / 3); aspect-ratio: 4 / 3;
    border-radius: 10px; background: #000; touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent; box-shadow: 0 6px 30px rgba(0,0,0,.45); }
  #hint { color: var(--muted); font-size: 0.85rem; min-height: 1.2em; text-align: center; }
  kbd { font-family: inherit; border: 1px solid #5a5249; border-bottom-width: 2px; border-radius: 4px;
    padding: 0 5px; font-size: 0.8rem; color: var(--fg); }
  body.fs header, body.fs #hint { display: none; }
  body.fs { padding: 0; }
  body.fs #stage { width: min(100%, 100dvh * 4 / 3); border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
  <header>
    <a class="icon" href="./">← 처음</a>
    <h1>종묘제례악 악기 연주</h1>
    <a class="icon" href="maker.html">제례악 만들기 →</a>
    <button class="icon" id="fsBtn" type="button">전체 화면</button>
  </header>
  <canvas id="stage" aria-label="종묘제례악 악기 연주 무대"></canvas>
  <div id="hint"></div>
  <script src="app.js"></script>
</body>
</html>
